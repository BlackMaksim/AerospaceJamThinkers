<!DOCTYPE html>
<html>
<head>
    <title>Aerospace Jam Thinkers - Mission Control</title>
    <script src="{{ url_for('static', filename='js/socket.io.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chart.js') }}"></script>
    
    <style>
        body { 
            font-family: 'Segoe UI', monospace;
            background: #1a1a1a; 
            color: #ecf0f1; 
            padding: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        .dashboard { 
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 20px;
        }
        .card { 
            background: #2d2d2d;
            border-radius: 10px; 
            padding: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.5); 
            border: 1px solid #444; 
        }
        .card-full-width { 
            grid-column: 1 / -1; 
            border: 1px solid #f1c40f;
        }
        .flex-row {
            display: flex;
            justify-content: space-around;
        }
        h2 { 
            margin-top: 0;
            color: #4caf50; 
            font-size: 1.1rem; 
            border-bottom: 1px solid #444;
            padding-bottom: 5px; 
            text-transform: uppercase;
        }
        .pos-grid { 
            display: flex;
            justify-content: space-around;
            font-size: 1.8rem;
            font-weight: bold;
            font-family: monospace;
            padding: 10px 0;
        }
        .rot-grid { 
            display: flex;
            justify-content: space-around;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: monospace;
            padding: 10px 0;
            border-top: 1px solid #444;
            margin-top: 10px;
        }
        .val-box { 
            text-align: center;
        }
        .label { 
            font-size: 0.8rem;
            color: #888; 
            display: block; 
        }
        .controls { 
            grid-column: 1 / -1; 
            text-align: center; 
            margin-bottom: 20px;
            background: #222;
            padding: 15px;
            border-radius: 10px;
        }
        button { 
            padding: 15px 40px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px; 
            margin: 0 10px;
            font-weight: bold;
            color: white; 
            transition: all 0.2s;
        }
        .btn-fwd { 
            background: #27ae60; 
            box-shadow: 0 4px 0 #1e8449; 
        }
        .btn-stop { 
            background: #c0392b;
            box-shadow: 0 4px 0 #922b21;
        }
        .btn-bwd { 
            background: #f39c12;
            box-shadow: 0 4px 0 #d35400; 
        }
        button:active { 
            transform: translateY(4px);
            box-shadow: none; 
        }
        .yellow { 
            color: #f1c40f;
        }
        .orange {
            color: #e67e22;
        }
        .red {
            color: #e74c3c;
        }
        .blue { 
            color: #3498db;
        }
        .purple { 
            color: #9b59b6;
        }
        .cyan { 
            color: #1abc9c;
        }
        .lightcyan { 
            color: #00bcd4;
        }
        .big  {
            font-size: 2rem;
        }
        canvas { 
            max-height: 180px;
        }
    </style>
</head>
<body>

    <div class="controls">
        <h1>🚀 Welcome to Aerospace Jam Thinkers Ground Control!</h1>
        <button class="btn-fwd" onclick="sendCommand('forward')">⬆️ Forward</button>
        <button class="btn-stop" onclick="sendCommand('stop')">⏹️ Stop</button>
        <button class="btn-bwd" onclick="sendCommand('backward')">⬇️ Backward</button>
    </div>

    <div class="dashboard">
        <div class="card card-full-width">
            <h2 class="yellow">📍 Integrated Navigation Data (Absolute Position)</h2>
            <div class="pos-grid">
                <div class="val-box"><span class="label">Pos X (m)</span><span id="posX" class="yellow">0.00</span></div>
                <div class="val-box"><span class="label">Pos Y (m)</span><span id="posY" class="orange">0.00</span></div>
                <div class="val-box"><span class="label">Pos Z (m)</span><span id="posZ" class="red">0.00</span></div>
            </div>
            <canvas id="posChart"></canvas>
        </div>

        <div class="card">
            <h2>📈 Acceleration (m/s²)</h2>
            <canvas id="accelChart"></canvas>
        </div>

        <div class="card">
            <h2>🔄 Absolute Rotation (deg)</h2>
            <div class="rot-grid">
                <div class="val-box"><span class="label">Roll</span><span id="rotX" class="blue">0.0</span></div>
                <div class="val-box"><span class="label">Pitch</span><span id="rotY" class="purple">0.0</span></div>
                <div class="val-box"><span class="label">Yaw</span><span id="rotZ" class="cyan">0.0</span></div>
            </div>
        </div>

        <div class="card">
            <h2>📡 LiDAR / Barometer</h2>
            <div class="flex-row">
                <div id="lidarVal" class="big lightcyan">-- cm</div>
                <div id="pressVal" class="big lightcyan">-- hPa</div>
            </div>
        </div>
    </div>

    <div style="margin-top: 30px; padding: 20px; background: #f0f0f0; border-radius: 10px;">
        <h2>📸 Camera</h2>
        <button id="takePictureButton" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
            Take Picture
        </button>
        <br><br>
        <img id="cameraImage" src="" alt="Camera not activated yet" 
             style="width: 640px; height: 480px; border: 2px solid #333; border-radius: 5px;">
    </div>

    <script>
        const socket = io.connect('http://' + document.domain + ':' + location.port);
        const maxDataPoints = 40;

        const commonOptions = {
            responsive: true, maintainAspectRatio: false, animation: false,
            scales: {
                x: { ticks: { display: false }, grid: { color: '#333' } },
                y: { ticks: { color: '#888' }, grid: { color: '#333' } }
            },
            plugins: { legend: { labels: { color: '#fff' } } },
            elements: { point: { radius: 0 }, line: { tension: 0.1 } }
        };

        const ctxPos = document.getElementById('posChart').getContext('2d');
        const posChart = new Chart(ctxPos, {
            type: 'line',
            data: { labels: [], datasets: [
                { label: 'Pos X', borderColor: '#f1c40f', data: [], borderWidth: 2 },
                { label: 'Pos Y', borderColor: '#e67e22', data: [], borderWidth: 2 },
                { label: 'Pos Z', borderColor: '#e74c3c', data: [], borderWidth: 2 }
            ]},
            options: commonOptions
        });

        const ctxAccel = document.getElementById('accelChart').getContext('2d');
        const accelChart = new Chart(ctxAccel, {
            type: 'line',
            data: { labels: [], datasets: [
                { label: 'Acc X', borderColor: '#ff6384', data: [], borderWidth: 2 },
                { label: 'Acc Y', borderColor: '#36a2eb', data: [], borderWidth: 2 },
                { label: 'Acc Z', borderColor: '#cc65fe', data: [], borderWidth: 2 }
            ]},
            options: commonOptions
        });

        socket.on('update_data', (msg) => {
            if(msg.posX !== undefined) {
                document.getElementById('posX').innerText = msg.posX.toFixed(2);
                document.getElementById('posY').innerText = msg.posY.toFixed(2);
                document.getElementById('posZ').innerText = msg.posZ.toFixed(2);
                document.getElementById('rotX').innerText = msg.rotX.toFixed(1);
                document.getElementById('rotY').innerText = msg.rotY.toFixed(1);
                document.getElementById('rotZ').innerText = msg.rotZ.toFixed(1);
                document.getElementById('lidarVal').innerText = msg.lidarDistance + " cm";
                document.getElementById('pressVal').innerText = msg.barometricPressure + " hPa";

                addData(posChart, msg.time, [msg.posX, msg.posY, msg.posZ]);
                addData(accelChart, msg.time, [msg.accelX, msg.accelY, msg.accelZ]);
            }
        });
        
        var takePictureButton = document.getElementById('takePictureButton');
        var cameraImage = document.getElementById('cameraImage');
        
        takePictureButton.addEventListener('click', function() {
            console.log('📸 Requesting image...');
            socket.emit('request_image');
        });
        
        socket.on('new_image', function(msg) {
            console.log('✅ Image received!');
            cameraImage.src = 'data:image/jpeg;base64,' + msg.image_data;
        });
        
        // Add new data point to chart
        function addData(chart, label, newValues) {
            chart.data.labels.push(label);
            chart.data.datasets.forEach((dataset, index) => dataset.data.push(newValues[index]));
            if (chart.data.labels.length > maxDataPoints) {
                chart.data.labels.shift();
                chart.data.datasets.forEach(ds => ds.data.shift());
            }
            chart.update();
        }
        
        // Send motor command to server
        function sendCommand(act) { socket.emit('control_motor', { action: act }); }
    </script>
</body>
</html>
